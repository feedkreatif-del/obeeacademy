<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta property="og:description" content="Platform kelas dan workshop interaktif oleh Obeecreatives: slide presentasi real-time, lembar kerja peserta, polling live, tanya-jawab, dan papan tulis kolaboratif." />

    <link rel="icon" type="image/png" sizes="192x192" href="/obee-pwa-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FFF7EC] text-[#1F3A5F] antialiased selection:bg-[#F28C28]/20 selection:text-[#1F3A5F]">
    <div id="root"></div>
    <script>
      (function () {
        var RECOVER_KEY = 'obee_boot_recover_v1';
        window.__OBEE_MOUNTED__ = false;

        function clearSwAndCaches() {
          var tasks = [];
          try {
            if ('serviceWorker' in navigator) {
              tasks.push(
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister(); }));
                })
              );
            }
          } catch (e) {}
          try {
            if ('caches' in window) {
              tasks.push(
                caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                })
              );
            }
          } catch (e) {}
          return Promise.all(tasks);
        }

        function renderFallbackUi(reason) {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#FFF7EC;color:#1F3A5F;font-family:system-ui,-apple-system,sans-serif;">' +
            '<div style="max-width:420px;width:100%;background:#ffffff;border:1px solid rgba(31,58,95,0.15);border-radius:20px;padding:28px;text-align:center;box-shadow:0 14px 40px rgba(31,58,95,0.08);">' +
            '<div style="width:48px;height:48px;margin:0 auto 14px;border-radius:14px;background:#1F3A5F;color:#F28C28;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;">!</div>' +
            '<h2 style="margin:0 0 8px;font-size:18px;font-weight:800;">Aplikasi Perlu Diperbarui</h2>' +
            '<p style="margin:0 0 18px;font-size:13px;line-height:1.55;color:rgba(31,58,95,0.75);">' +
            'Tampilan tersimpan di aplikasi desktop masih memakai versi lama' +
            (reason ? ' (' + String(reason).replace(/[<>&"]/g, '') + ')' : '') +
            '. Klik tombol di bawah untuk membersihkan cache dan memuat versi terbaru.' +
            '</p>' +
            '<button id="obee-hard-recover-btn" type="button" style="width:100%;padding:12px 16px;border:none;border-radius:12px;background:#F28C28;color:#fff;font-weight:700;font-size:14px;cursor:pointer;">Bersihkan Cache &amp; Muat Ulang</button>' +
            '</div></div>';
          var btn = document.getElementById('obee-hard-recover-btn');
          if (btn) {
            btn.onclick = function () {
              try { window.sessionStorage.removeItem(RECOVER_KEY); } catch (e) {}
              clearSwAndCaches().finally(function () {
                window.location.reload();
              });
            };
          }
        }

        function attemptAutoRecover(reason) {
          if (window.__OBEE_MOUNTED__) return;
          if (typeof navigator !== 'undefined' && navigator.onLine === false) {
            renderFallbackUi('sedang offline');
            return;
          }
          var lastTs = 0;
          try {
            lastTs = Number(window.sessionStorage.getItem(RECOVER_KEY) || '0');
          } catch (e) {}
          if (Date.now() - lastTs > 30000) {
            try { window.sessionStorage.setItem(RECOVER_KEY, String(Date.now())); } catch (e) {}
            clearSwAndCaches().finally(function () {
              window.location.reload();
            });
          } else {
            renderFallbackUi(reason);
          }
        }

        window.addEventListener(
          'error',
          function (ev) {
            if (window.__OBEE_MOUNTED__) return;
            var target = ev && ev.target;
            if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
              attemptAutoRecover('aset versi lama');
            }
          },
          true
        );

        window.setTimeout(function () {
          if (!window.__OBEE_MOUNTED__) {
            var root = document.getElementById('root');
            if (!root || root.childElementCount === 0) {
              attemptAutoRecover('waktu muat habis');
            }
          }
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
